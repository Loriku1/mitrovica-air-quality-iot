openapi: 3.1.0

info:
  title: Alert Service API
  version: 1.0.0
  description: >
    API for monitoring air quality threshold violations
    and retrieving alerts generated by the platform.

servers:
  - url: http://localhost:3103
    description: Local development server

tags:
  - name: Health
  - name: Alerts

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/alerts:
    get:
      tags:
        - Alerts
      summary: Retrieve air quality alerts
      parameters:
        - name: sensorId
          in: query
          required: false
          schema:
            type: string
          description: Filter alerts by sensor ID.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - resolved
          description: Filter alerts by status.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - count
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  count:
                    type: integer
        "400":
          description: Invalid query parameters
        "503":
          description: Alert database unavailable

  /v1/alerts/{alertId}:
    get:
      tags:
        - Alerts
      summary: Retrieve a specific alert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Alert retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Alert not found
        "503":
          description: Alert database unavailable

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: alert-service

    Alert:
      type: object
      required:
        - alertId
        - sensorId
        - pollutant
        - measuredValue
        - threshold
        - severity
        - status
        - triggeredAt
      properties:
        alertId:
          type: string
          format: uuid
        sensorId:
          type: string
          example: MIT-SENSOR-001
        pollutant:
          type: string
          enum:
            - PM2.5
            - PM10
        measuredValue:
          type: number
          minimum: 0
          example: 85.5
        threshold:
          type: number
          minimum: 0
          example: 75
        severity:
          type: string
          enum:
            - warning
            - critical
          example: warning
        status:
          type: string
          enum:
            - active
            - resolved
          example: active
        triggeredAt:
          type: string
          format: date-time
        resolvedAt:
  type:
    - string
    - "null"
  format: date-time
  description: Time when the alert was resolved, or null if still active.
